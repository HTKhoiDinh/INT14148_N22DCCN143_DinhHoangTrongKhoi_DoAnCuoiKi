<!DOCTYPE html>
<html>

<head>
    <title>Distributed SQL Query Guard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">

            <h2>Distributed SQL Query Guard</h2>

            <p class="mb-0">
                SQL Injection Firewall for Distributed Databases
            </p>

        </div>

        <div class="card-body">

            <form action="/query" method="post">

                <div class="mb-3">
                    <label class="form-label">
                        User
                    </label>

                    <input
                        type="text"
                        name="user"
                        class="form-control"
                        placeholder="e.g., alice / bob / admin"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        SQL Query
                    </label>

                    <textarea
                        class="form-control"
                        rows="8"
                        name="sql"
                        placeholder="e.g., SELECT * FROM Employee WHERE ID=100"
                        required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Execute
                </button>

                <button type="reset" class="btn btn-secondary">
                    Reset
                </button>

            </form>

        </div>

        <div class="card-footer text-muted">

            <b>Users:</b>
            alice → Site 1,
            bob → Site 2,
            admin → Site 1 + Site 2

        </div>

    </div>

</div>

</body>

</html>
