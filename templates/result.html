<!DOCTYPE html>
<html>

<head>
    <title>Query Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-{{ color }} text-white">

            <h2>{{ status }}</h2>

            <p class="mb-0">
                {{ message }}
            </p>

        </div>

        <div class="card-body">

            <h5>Request Information</h5>

            <table class="table table-bordered">

                <tr>
                    <th>User</th>
                    <td>{{ user }}</td>
                </tr>

                <tr>
                    <th>SQL Query</th>
                    <td>
                        <code>{{ sql }}</code>
                    </td>
                </tr>

                <tr>
                    <th>Reason</th>
                    <td>{{ reason }}</td>
                </tr>

                {% if site %}
                <tr>
                    <th>Distributed Site</th>
                    <td>Site {{ site }}</td>
                </tr>
                {% endif %}

            </table>

            {% if employee %}

            <h5>Employee Result</h5>

            <table class="table table-striped table-bordered">

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                </tr>

                <tr>
                    <td>{{ employee[0] }}</td>
                    <td>{{ employee[1] }}</td>
                    <td>{{ employee[2] }}</td>
                </tr>

            </table>

            {% endif %}

            <a href="/" class="btn btn-dark">
                Back
            </a>

        </div>

    </div>

</div>

</body>

</html>
